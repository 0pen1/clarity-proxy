name: netproxy
options:
  bundleIdPrefix: local.netproxy
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  NetProxy:
    type: application
    platform: macOS
    sources:
      - path: ../Host/HostApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.clarity.${DEVELOPMENT_TEAM_LC}
        PRODUCT_NAME: NetProxy
        INFOPLIST_FILE: netproxy/Info.plist
        CODE_SIGN_ENTITLEMENTS: netproxy/host.entitlements
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1.1"
        # CLI 型 host:LSUIElement 无窗口
        LSUIElement: true
    dependencies:
      - target: NetProxyExtension
        embed: true
        codeSign: true
        # 系统扩展必须嵌到 Contents/Library/SystemExtensions,不是 PlugIns
        embedLocation:
          type: library
          path: SystemExtensions
  NetProxyExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ../Sysex/main.swift
      - path: ../Sysex/UDPFlow.swift
      - path: ../Sysex/Provider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.clarity.${DEVELOPMENT_TEAM_LC}.extension
        PRODUCT_NAME: local.clarity.${DEVELOPMENT_TEAM_LC}.extension
        INFOPLIST_FILE: netproxy/ext-Info.plist
        CODE_SIGN_ENTITLEMENTS: netproxy/ext.entitlements
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1.1"
        # System Extension 类型(不是普通 appex)
        PACKAGE_TYPE: SYSX
        WRAPPER_EXTENSION: systemextension
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: -lbsm
        LD_ENTRY_POINT: _main
        SWIFT_OBJC_BRIDGING_HEADER: netproxy/bridge.h
