name: netproxy
options:
  bundleIdPrefix: local.netproxy
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
settings:
  base:
    DEVELOPMENT_TEAM: 3W73W8C23L
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  NetProxy:
    type: application
    platform: macOS
    sources:
      - path: ../Host/HostApp.swift
      - path: ../Shared/ProxyCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.netproxy.3w73w8c23l
        PRODUCT_NAME: NetProxy
        INFOPLIST_FILE: netproxy/Info.plist
        CODE_SIGN_ENTITLEMENTS: netproxy/host.entitlements
        MARKETING_VERSION: "3.6"
        CURRENT_PROJECT_VERSION: "2609201017"
        # CLI 型 host:LSUIElement 无窗口
        LSUIElement: true
    dependencies:
      - target: NetProxyExtension
        embed: true
        codeSign: true
        # 系统扩展必须嵌到 Contents/Library/SystemExtensions,不是 PlugIns
        embedLocation:
          type: library
          path: SystemExtensions
  NetProxyExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ../Sysex/main.swift
      - path: ../Sysex/UDPFlow.swift
      - path: ../Sysex/Provider.swift
      - path: ../Sysex/ConfigXPC.swift
      - path: ../Shared/ProxyCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.netproxy.3w73w8c23l.extension
        PRODUCT_NAME: local.netproxy.3w73w8c23l.extension
        INFOPLIST_FILE: netproxy/ext-Info.plist
        CODE_SIGN_ENTITLEMENTS: netproxy/ext.entitlements
        MARKETING_VERSION: "3.6"
        CURRENT_PROJECT_VERSION: "2609201017"
        # System Extension 类型(不是普通 appex)
        PACKAGE_TYPE: SYSX
        WRAPPER_EXTENSION: systemextension
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: -lbsm
        LD_ENTRY_POINT: _main
        SWIFT_OBJC_BRIDGING_HEADER: netproxy/bridge.h
  ProxyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Tests/ProxyCoreTests.swift
      # Shared 源直接编进 test bundle（同 module，无需 import；不依赖宿主 app
      # ——纯 Foundation 逻辑无 NE 环境即可跑）
      - path: ../Shared/ProxyCore.swift
    # 注意：不依赖 NetProxy app——依赖会触发 xcodegen 设 TEST_HOST，而 NetProxy
    # 的 main() 把 xctest 注入参数当 CLI 命令解析后 exit(2)，测试 runner 无法 bootstrap。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.netproxy.3w73w8c23l.tests
        GENERATE_INFOPLIST_FILE: YES
